<div class="form-group"><label>OS TYPE</label>
<select id="f2"><option>Windows</option><option>Linux</option><option>macOS</option><option>Other</option></select></div>

  <div class="confirm-modal">
    <div class="confirm-title" id="confirmTitle">CONFIRM DELETE</div>

      <button class="btn btn-red" onclick="confirmNo()">CANCEL</button>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  if(!localStorage.getItem("cy_user")){window.location.href="index.html";return;}
  const u=JSON.parse(localStorage.getItem("cy_user")||"{}");
  const av=document.getElementById("uavatar");
  const un=document.getElementById("uname");
  if(av && u.username) av.textContent=u.username.substring(0,2).toUpperCase();
  if(un && u.username) un.textContent=u.username;
  const rb=document.getElementById("roleBadge");
  if(rb && u.role) rb.textContent=u.role.charAt(0).toUpperCase()+u.role.slice(1);
})();
</script>
<script src="js/app.js"></script>
<script>
const systemHtmlEntities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function escapeSystemText(value) {
  const text = typeof value === "string" || typeof value === "number" ? String(value) : "";
  return text.replace(/[&<>"']/g, character => systemHtmlEntities[character]);
}

window._table = new CyberTable({
  tbodyId:"tbody", searchId:"searchBox",
  filterSelects:[{id:"osFilter",col:"os_type"}],
  countId:"recordCount", paginationId:"pagination",
  columns:[{key:"system_id",label:"ID"},{key:"system_name",label:"Name"},{key:"os_type",label:"OS"},{key:"ip_address",label:"IP"}],
  renderRow: s => {
    const hasActionId = Number.isSafeInteger(s.system_id);
    const editAction = hasActionId ? `onclick="editModal(${s.system_id})"` : "disabled";
    const deleteAction = hasActionId ? `onclick="del(${s.system_id})"` : "disabled";

    return `
    <tr>
    <td>${escapeSystemText(s.system_id)}</td>
    <td><strong>${escapeSystemText(s.system_name)}</strong></td>
    <td>${escapeSystemText(s.os_type || "?")}</td>
    <td style="font-family:monospace;color:var(--cyan)">${escapeSystemText(s.ip_address || "?")}</td>
    <td style="display:flex;gap:4px">
      <button class="btn btn-sm" ${editAction}>EDIT</button>
      <button class="btn btn-red btn-sm" ${deleteAction}>DEL</button>
    </td>
    </tr>`;
  }
});
async function load(){
  const data=await authFetch(API+"systems").then(r=>r.json());
  window._table.load(data);
}
function openModal(editData=null){
  if(editData){
    document.getElementById("modalTitle").textContent="EDIT SYSTEM";
    document.getElementById("editId").value=editData.system_id;
    document.getElementById("f1").value=editData.system_name;
    document.getElementById("f2").value=editData.os_type||"";
    document.getElementById("f3").value=editData.ip_address||"";
  } else {
    document.getElementById("modalTitle").textContent="ADD SYSTEM";
    document.getElementById("editId").value="";
    document.getElementById("f1").value=""; document.getElementById("f3").value="";
  }
  document.getElementById("modal").classList.add("active");
}
function editModal(id){ openModal(window._table.allData.find(x=>x.system_id===id)); }
async function save(){
  const editId=document.getElementById("editId").value;
  const body={system_name:document.getElementById("f1").value,os_type:document.getElementById("f2").value,ip_address:document.getElementById("f3").value};
  if(editId){
    await authFetch(API+"systems/"+editId,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    showToast("System updated");
  } else {
    await authFetch(API+"systems",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    showToast("System added");
  }
  closeModal();load();
}
function del(id){ showConfirm("Delete this system? This may affect linked data.",async()=>{ await authFetch(API+"systems/"+id,{method:"DELETE"}); load();showToast("System deleted","error"); }); }
function closeModal(){document.getElementById("modal").classList.remove("active");}
load();
</script>
