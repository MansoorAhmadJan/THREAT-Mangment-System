<div style="margin-top:auto;">
<div style="padding:10px 20px;border-top:1px solid #1a3a5c;">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;" id="sidebarUser">
<div style="width:32px;height:32px;border-radius:50%;background:rgba(0,212,255,0.15);border:1px solid #00d4ff;display:flex;align-items:center;justify-content:center;color:#00d4ff;font-size:11px;font-weight:bold;flex-shrink:0;" id="uavatar">AD</div>
<div>
<div style="color:#e0e6f0;font-size:11px;" id="uname">admin</div>
<div style="color:#8899aa;font-size:9px;" id="roleBadge">Administrator</div>
</div>
</div>
<button onclick="logout()" style="width:100%;padding:9px;background:rgba(255,62,108,0.1);border:1px solid #ff3e6c;color:#ff3e6c;cursor:pointer;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;border-radius:4px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;" onmouseover="this.style.background='#ff3e6c';this.style.color='#0a0e1a';" onmouseout="this.style.background='rgba(255,62,108,0.1)';this.style.color='#ff3e6c';">
&#9211; LOGOUT
</button>

<div class="main">
<div class="page-header">
  <div class="page-title">AUDIT LOGS <span>AUTO-GENERATED BY TRIGGERS</span></div>
  <button class="btn-export" onclick="window._table?.exportCSV()">⬇ EXPORT CSV</button>
  <button class="btn-export" style="border-color:var(--red);color:var(--red)" onclick="exportPDF()">⬇ PDF</button>
</div>

<div class="table-toolbar">
  <div class="search-box"><input id="searchBox" type="text" placeholder="Search logs..."/></div>
  <div class="date-range">
    <span class="date-range-label">FROM</span><input type="date" id="dateFrom"/>
    <span class="date-range-label">TO</span><input type="date" id="dateTo"/>
  </div>
  <span id="recordCount" class="record-count"></span>
</div>

<div class="table-wrap">
<table class="cyber-table">
<thead><tr>
  <th data-col="log_id" onclick="window._table?.sortBy('log_id')">LOG # <span class="sort-icon">⇅</span></th>
  <th data-col="action" onclick="window._table?.sortBy('action')">ACTION <span class="sort-icon">⇅</span></th>
  <th data-col="performed_by_username" onclick="window._table?.sortBy('performed_by_username')">BY USER <span class="sort-icon">⇅</span></th>
  <th data-col="log_time" onclick="window._table?.sortBy('log_time')">DATE / TIME <span class="sort-icon">⇅</span></th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="pagination" class="pagination"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  if(!localStorage.getItem("cy_user")){window.location.href="index.html";return;}
  const u=JSON.parse(localStorage.getItem("cy_user")||"{}");
  const av=document.getElementById("uavatar");
  const un=document.getElementById("uname");
  if(av && u.username) av.textContent=u.username.substring(0,2).toUpperCase();
  if(un && u.username) un.textContent=u.username;
  const rb=document.getElementById("roleBadge");
  if(rb && u.role) rb.textContent=u.role.charAt(0).toUpperCase()+u.role.slice(1);
})();
</script>
<script src="js/app.js"></script>
<script>
const auditLogHtmlEntities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function escapeAuditLogText(value) {
  const text = typeof value === "string" || typeof value === "number" ? String(value) : "";
  return text.replace(/[&<>"']/g, character => auditLogHtmlEntities[character]);
}

window._table = new CyberTable({
  tbodyId:"tbody", searchId:"searchBox",
  dateRangeIds:{from:"dateFrom",to:"dateTo",col:"log_time"},
  countId:"recordCount", paginationId:"pagination",
  pageSize:20,
  columns:[{key:"log_id",label:"ID"},{key:"action",label:"Action"},{key:"performed_by_username",label:"User"},{key:"log_time",label:"Time"}],
  renderRow: l => `
    <tr>
    <td style="color:var(--subtext)">${escapeAuditLogText(l.log_id)}</td>
    <td>${escapeAuditLogText(l.action)}</td>
    <td style="color:var(--cyan)">${escapeAuditLogText(l.performed_by_username || "system")}</td>
    <td style="color:var(--subtext);font-size:12px">${escapeAuditLogText(l.log_time)}</td>
    </tr>`
});

authFetch(API+"auditlogs").then(r=>r.json()).then(data=>window._table.load(data));
</script>

</body></html>
