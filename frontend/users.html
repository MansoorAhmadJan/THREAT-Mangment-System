<div class="main">
<div class="page-header">
  <div class="page-title">USERS <span>MANAGEMENT</span></div>

    <button class="btn-export" onclick="window._table?.exportCSV()">⬇ EXPORT CSV</button>
    <button class="btn-export" style="border-color:var(--red);color:var(--red)" onclick="exportPDF()">⬇ PDF</button>
    <button class="btn" onclick="openModal()">+ ADD USER</button>
  </div>
</div>

<div class="table-toolbar">
  <div class="search-box"><input id="searchBox" type="text" placeholder="Search users..."/></div>
  <select id="roleFilter" class="filter-select">
    <option value="">ALL ROLES</option>
    <option value="Admin">Admin</option>
    <option value="Analyst">Analyst</option>
    <option value="Viewer">Viewer</option>
  </select>
  <span id="recordCount" class="record-count"></span>
</div>

<div class="table-wrap">
<table class="cyber-table">
<thead><tr>
  <th data-col="user_id" onclick="window._table?.sortBy('user_id')"># <span class="sort-icon">⇅</span></th>
  <th data-col="username" onclick="window._table?.sortBy('username')">USERNAME <span class="sort-icon">⇅</span></th>
  <th data-col="email" onclick="window._table?.sortBy('email')">EMAIL <span class="sort-icon">⇅</span></th>
  <th data-col="role" onclick="window._table?.sortBy('role')">ROLE <span class="sort-icon">⇅</span></th>
  <th data-col="created_at" onclick="window._table?.sortBy('created_at')">CREATED <span class="sort-icon">⇅</span></th>
  <th>ACTION</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="pagination" class="pagination"></div>
</div>
</div>

<div class="modal-overlay" id="modal"><div class="modal">
<div class="modal-title" id="modalTitle">ADD USER</div>
<input type="hidden" id="editId"/>
<div class="form-group"><label>USERNAME</label><input type="text" id="f1" placeholder="e.g. jsmith"/></div>
<div class="form-group"><label>EMAIL</label><input type="email" id="f2" placeholder="e.g. j.smith@org.com"/></div>
<div class="form-group" id="pwGroup"><label>PASSWORD</label><input type="password" id="f3" placeholder="Enter password"/></div>
<div class="form-group"><label>ROLE</label>
<select id="f4"><option>Admin</option><option>Analyst</option><option>Viewer</option></select></div>
<div style="display:flex;gap:10px;justify-content:flex-end">
<button class="btn btn-red" onclick="closeModal()">CANCEL</button>
<button class="btn btn-green" onclick="save()">SAVE</button>
</div>
</div></div>

<div class="modal-overlay" id="pwModal"><div class="modal">
<div class="modal-title">CHANGE PASSWORD</div>
<input type="hidden" id="pwUserId"/>
<div style="font-size:12px;color:var(--subtext);margin-bottom:16px;" id="pwUsername"></div>
<div class="form-group"><label>NEW PASSWORD</label><input type="password" id="newPw" placeholder="Enter new password"/></div>
<div class="form-group"><label>CONFIRM PASSWORD</label><input type="password" id="confirmPw" placeholder="Confirm new password"/></div>
<div style="display:flex;gap:10px;justify-content:flex-end">
<button class="btn btn-red" onclick="closePwModal()">CANCEL</button>
<button class="btn btn-green" onclick="savePassword()">CHANGE</button>
</div>

  <div class="confirm-modal">
    <div class="confirm-title" id="confirmTitle">CONFIRM DELETE</div>

    <div class="confirm-btns">
      <button class="btn btn-red" onclick="confirmNo()">CANCEL</button>
      <button class="btn" style="border-color:var(--red);color:var(--red)" onclick="confirmYes()">DELETE</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  if(!localStorage.getItem("cy_user")){window.location.href="index.html";return;}
  const u=JSON.parse(localStorage.getItem("cy_user")||"{}");
  const av=document.getElementById("uavatar");
  const un=document.getElementById("uname");
  if(av && u.username) av.textContent=u.username.substring(0,2).toUpperCase();
  if(un && u.username) un.textContent=u.username;
  const rb=document.getElementById("roleBadge");
  if(rb && u.role) rb.textContent=u.role.charAt(0).toUpperCase()+u.role.slice(1);
})();
</script>
<script src="js/app.js"></script>
<script>
const roleColors = new Map([["Admin", "badge-critical"], ["Analyst", "badge-medium"], ["Viewer", "badge-low"]]);
const userHtmlEntities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function escapeUserText(value) {
  const text = typeof value === "string" || typeof value === "number" ? String(value) : "";
  return text.replace(/[&<>"']/g, character => userHtmlEntities[character]);
}

function isUserId(id) { return Number.isSafeInteger(id) && id > 0; }

window._table = new CyberTable({
  tbodyId:"tbody", searchId:"searchBox",
  filterSelects:[{id:"roleFilter",col:"role"}],
  countId:"recordCount", paginationId:"pagination",
  columns:[{key:"user_id",label:"ID"},{key:"username",label:"Username"},{key:"email",label:"Email"},{key:"role",label:"Role"},{key:"created_at",label:"Created"}],
  renderRow: u => {
    const username = typeof u.username === "string" ? u.username : "";
    const created = typeof u.created_at === "string" ? u.created_at.substring(0,10) : "";
    const roleClass = roleColors.get(u.role) ?? "badge-low";
    const validId = isUserId(u.user_id);
    const rowId = validId ? ` data-user-id="${u.user_id}"` : "";
    const disabled = validId ? "" : " disabled";

    return `
    <tr${rowId}>
    <td style="color:var(--subtext)">${escapeUserText(u.user_id)}</td>
    <td>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:rgba(0,212,255,0.15);border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cyan);font-weight:bold;flex-shrink:0">
          ${escapeUserText((username || "??").substring(0,2).toUpperCase())}
        </div>
        <strong>${escapeUserText(username)}</strong>
      </div>
    </td>
    <td style="color:var(--subtext)">${escapeUserText(u.email || "—")}</td>
    <td><span class="badge ${roleClass}">${escapeUserText(u.role || "Viewer")}</span></td>
    <td style="color:var(--subtext);font-size:12px">${escapeUserText(created)}</td>
    <td style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="btn btn-sm" data-user-action="edit"${disabled}>EDIT</button>
      <button class="btn btn-sm" style="border-color:#ff8c00;color:#ff8c00" data-user-action="password"${disabled}>PWD</button>
      <button class="btn btn-red btn-sm" data-user-action="delete"${disabled}>DEL</button>
    </td>
    </tr>`;
  }
});

document.getElementById("tbody").addEventListener("click", event => {
  const button = event.target.closest("button[data-user-action]");
  if (!button || button.disabled) return;
  const id = Number(button.closest("tr")?.dataset.userId);
  if (!isUserId(id)) return;
  const user = window._table.allData.find(record => record.user_id === id);
  if (!user) return;

  switch (button.dataset.userAction) {
    case "edit": openModal(user); break;
    case "password": openPwModal(id, user.username); break;
    case "delete": del(id); break;
  }
});

async function load(){ const data=await authFetch(API+"users").then(r=>r.json()); window._table.load(data); }
function openModal(editData=null){
  document.getElementById("pwGroup").style.display=editData?"none":"block";
  if(editData){
    document.getElementById("modalTitle").textContent="EDIT USER";
    document.getElementById("editId").value=editData.user_id;
    document.getElementById("f1").value=editData.username;
    document.getElementById("f2").value=editData.email||"";
    document.getElementById("f4").value=editData.role||"Viewer";
  } else {
    document.getElementById("modalTitle").textContent="ADD USER";
    document.getElementById("editId").value="";
    document.getElementById("f1").value="";
    document.getElementById("f2").value="";
    document.getElementById("f3").value="";
  }
  document.getElementById("modal").classList.add("active");
}
async function save(){
  const editId=document.getElementById("editId").value;
  const body={username:document.getElementById("f1").value,email:document.getElementById("f2").value,role:document.getElementById("f4").value};
  if(!editId) body.password=document.getElementById("f3").value;
  if(!body.username){showToast("Username is required","error");return;}
  if(editId){
    await authFetch(API+"users/"+editId,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    showToast("User updated");
  } else {
    if(!body.password){showToast("Password is required","error");return;}
    await authFetch(API+"users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    showToast("User created");
  }
  closeModal();load();
}
function openPwModal(id,uname){
  document.getElementById("pwUserId").value=id;
  document.getElementById("pwUsername").textContent="Changing password for: "+(typeof uname === "string" ? uname : "");
  document.getElementById("newPw").value="";
  document.getElementById("confirmPw").value="";
  document.getElementById("pwModal").classList.add("active");
}
async function savePassword(){
  const id=document.getElementById("pwUserId").value;
  const np=document.getElementById("newPw").value;
  const cp=document.getElementById("confirmPw").value;
  if(!np){showToast("Password cannot be empty","error");return;}
  if(np!==cp){showToast("Passwords do not match","error");return;}
  await authFetch(API+"users/"+id+"/password",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:np})});
  closePwModal();showToast("Password changed successfully");
}
function del(id){ showConfirm("Delete this user? They will lose all access.",async()=>{ await authFetch(API+"users/"+id,{method:"DELETE"}); load();showToast("User deleted","error"); }); }
function closeModal(){document.getElementById("modal").classList.remove("active");}
function closePwModal(){document.getElementById("pwModal").classList.remove("active");}
load();
</script>
